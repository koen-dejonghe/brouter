[project]
name = "brouter-python-ui"
version = "0.1.0"
description = "Simple web UI for the BRouter routing engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
