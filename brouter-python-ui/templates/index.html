<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRouter UI</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/map-controls.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/elevation.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/search.css') }}" />
</head>
<body>

<div id="sidebar">
  <button id="sidebar-toggle" title="Collapse sidebar">‹</button>
  <div id="sidebar-content">

  <!-- Search -->
  <div id="search-wrap">
    <div id="search-row">
      <input type="text" id="search-input" placeholder="Search place or address…" autocomplete="off" />
      <button id="btn-search" title="Search">⌕</button>
    </div>
    <div id="search-dropdown"></div>
  </div>

  <!-- Waypoint controls -->
  <div id="waypoint-controls">
    <button id="btn-add-waypoint">+ Add waypoint</button>
    <button id="btn-reverse" disabled title="Reverse route order">⇅ Reverse</button>
    <button id="btn-clear-all" disabled title="Remove all waypoints">✕ Clear</button>
  </div>
  <div id="waypoint-list"></div>

  <!-- Profile -->
  <div class="field">
    <label>Profile</label>
    <select id="profile">
      {% for p in profiles %}
      <option value="{{ p }}" {% if p == 'trekking' %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </div>

  <!-- Profile settings (collapsible, dynamic) -->
  <details id="profile-settings">
    <summary>
      Profile settings
      <span id="changed-badge" style="display:none; font-size:0.7rem; background:#2563eb; color:white; border-radius:10px; padding:1px 7px;">changed</span>
    </summary>
    <div id="profile-settings-body">
      <div id="params-loading">Loading…</div>
    </div>
    <div style="padding: 4px 10px 10px;">
      <button id="btn-reset-params">Reset to defaults</button>
    </div>
  </details>

  <!-- Alternative -->
  <div class="field">
    <label>Alternative route</label>
    <select id="alternativeidx">
      <option value="0">0 — primary</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
    </select>
  </div>

  <!-- Output format -->
  <div class="field">
    <label>Download format</label>
    <select id="format">
      <option value="gpx">GPX</option>
      <option value="geojson">GeoJSON</option>
      <option value="kml">KML</option>
      <option value="csv">CSV</option>
    </select>
  </div>

  <!-- Track name -->
  <div class="field">
    <label>Track name</label>
    <input type="text" id="trackname" />
  </div>

  <!-- Actions -->
  <div id="route-actions">
    <button id="btn-import-gpx" type="button">Upload Route</button>
    <button id="btn-download" disabled>Download Route</button>
    <input type="file" id="gpx-file-input" accept=".gpx,application/gpx+xml" hidden />
  </div>
  <div id="surface-enrich-progress" class="import-progress" style="display:none;">
    <span class="spinner" aria-hidden="true"></span>
    <span>Fetching surface details via BRouter…</span>
  </div>

  <div id="status" class="status"></div>

  <!-- Stats -->
  <div id="stats" style="display:none;">
    <strong>Route info</strong>
    <div id="stats-body"></div>
  </div>

  </div><!-- /#sidebar-content -->
</div>

<!-- Map column: map + elevation panel -->
<div id="map-column">
  <div id="map"></div>

  <div id="profile-panel" class="collapsed">
    <!-- Header -->
    <div id="profile-panel-header">
      <span id="profile-panel-title">Elevation profile</span>
      <button class="mode-btn active" id="btn-mode-gradient">Gradient</button>
      <button class="mode-btn"        id="btn-mode-surface">Surface</button>
      <button id="btn-toggle-panel">▲ Show</button>
    </div>
    <!-- Chart -->
    <div id="profile-panel-body">
      <svg id="elev-svg"></svg>
      <div id="elev-hairline"></div>
      <div id="elev-tooltip"></div>
      <div id="sel-stats-card"></div>
    </div>
    <!-- Surface legend -->
    <div id="surface-legend"></div>
  </div>
</div>

<!-- Jinja2 data bridge: pass server-side data to ES modules -->
<script>
  window.PROFILES = {{ profiles | tojson }};
</script>

<!-- App entry point -->
<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
