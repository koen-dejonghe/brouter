<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRouter UI</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────────────────── */
    #sidebar {
      width: 420px;
      min-width: 420px;
      flex-shrink: 0;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      overflow-y: auto;
      overflow-x: hidden;
      color: #94a3b8;
      transition: width 0.25s ease, min-width 0.25s ease, padding 0.25s ease;
    }
    #sidebar.collapsed {
      width: 36px;
      min-width: 36px;
      padding: 8px 0;
      gap: 0;
    }

    #sidebar-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 36px;
      background: #334155;
      color: #cbd5e1;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
      align-self: flex-end;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    #sidebar-toggle:hover { background: #475569; }
    #sidebar.collapsed #sidebar-toggle { align-self: center; }

    #sidebar-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 388px; /* prevents content reflow during animation */
    }
    #sidebar.collapsed #sidebar-content { visibility: hidden; }

    /* Custom scrollbar to match dark theme */
    #sidebar::-webkit-scrollbar { width: 6px; }
    #sidebar::-webkit-scrollbar-track { background: #0f172a; }
    #sidebar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    h1 { font-size: 1.2rem; color: #e2e8f0; }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      display: block;
      margin-bottom: 3px;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      min-width: 0;
      padding: 6px 8px;
      border: 1px solid #334155;
      border-radius: 4px;
      font-size: 0.85rem;
      background: #0f172a;
      color: #e2e8f0;
    }
    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: #2563eb;
    }

    .field { display: flex; flex-direction: column; }
    .hint  { font-size: 0.72rem; color: #475569; margin-top: 2px; }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* ── Waypoint controls ───────────────────────────────────────────── */
    #waypoint-controls {
      display: flex;
      gap: 6px;
    }

    #btn-add-waypoint {
      flex: 1;
      background: #334155;
      color: #cbd5e1;
      font-size: 0.82rem;
      padding: 6px 10px;
    }
    #btn-add-waypoint:hover  { background: #475569; }
    #btn-add-waypoint.active { background: #2563eb; color: white; }

    #btn-reverse {
      background: #334155; color: #cbd5e1;
      font-size: 0.82rem; padding: 6px 10px;
    }
    #btn-reverse:hover    { background: #475569; }
    #btn-reverse:disabled { opacity: 0.35; cursor: default; }

    #btn-clear-all {
      background: #334155; color: #cbd5e1;
      font-size: 0.82rem; padding: 6px 10px;
    }
    #btn-clear-all:hover    { background: #475569; }
    #btn-clear-all:disabled { opacity: 0.35; cursor: default; }

    /* ── Waypoint list ───────────────────────────────────────────────── */
    #waypoint-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .wp-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 0.78rem;
      color: #94a3b8;
      cursor: default;
      transition: background 0.1s, border-color 0.1s;
    }
    .wp-row.highlighted {
      background: #172554;
      border-color: #2563eb;
    }
    .wp-row.drag-over {
      border-top: 2px solid #60a5fa;
    }
    .wp-row.dragging {
      opacity: 0.4;
    }

    .wp-handle {
      cursor: grab;
      color: #475569;
      font-size: 0.9rem;
      padding: 0 2px;
      flex-shrink: 0;
      user-select: none;
    }
    .wp-handle:active { cursor: grabbing; }

    .wp-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .wp-dot.large { width: 12px; height: 12px; }

    .wp-coords {
      flex: 1;
      font-variant-numeric: tabular-nums;
      font-size: 0.75rem;
      color: #64748b;
    }

    .wp-btns { display: flex; gap: 3px; }
    .wp-btns button {
      padding: 2px 6px;
      font-size: 0.72rem;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 3px;
    }
    .wp-btns button:hover { background: #334155; color: #e2e8f0; }

    /* ── Action buttons ──────────────────────────────────────────────── */
    #btn-download    { background: #16a34a; color: white; font-weight: 600; }
    #btn-download:hover    { background: #15803d; }
    #btn-download:disabled { background: #166534; color: #4ade80; cursor: not-allowed; }

    /* ── Locate map control ──────────────────────────────────────────── */
    .leaflet-control-locate a {
      display: flex !important;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #444;
      text-decoration: none;
      cursor: pointer;
    }
    .leaflet-control-locate a.locating {
      color: #2563eb;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      font-size: 0.8rem;
      padding: 6px 8px;
      border-radius: 4px;
      display: none;
    }
    .status.error { background: #450a0a; color: #fca5a5; display: block; }
    .status.info  { background: #0c1a3a; color: #93c5fd; display: block; }
    .status.ok    { background: #052e16; color: #86efac; display: block; }

    /* ── Profile settings panel ──────────────────────────────────────── */
    #profile-settings {
      border: 1px solid #334155;
      border-radius: 6px;
    }

    #profile-settings summary {
      padding: 7px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #94a3b8;
      cursor: pointer;
      background: #0f172a;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 6px;
    }
    #profile-settings[open] summary { border-radius: 6px 6px 0 0; }
    #profile-settings summary:hover { background: #1e293b; }

    #profile-settings-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .param-row { display: flex; flex-direction: column; gap: 2px; }
    .param-row label { font-size: 0.75rem; font-weight: 600; color: #cbd5e1; margin: 0; }
    .param-desc { font-size: 0.7rem; color: #475569; }
    .param-row input[type="number"], .param-row select { font-size: 0.82rem; padding: 4px 6px; }

    .bool-row { flex-direction: row; align-items: center; gap: 8px; }
    .bool-row label { font-size: 0.8rem; font-weight: 600; color: #cbd5e1; flex: 1; }
    .bool-row input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #2563eb; }

    .param-changed label { color: #60a5fa; }

    #btn-reset-params {
      font-size: 0.75rem; padding: 4px 8px;
      background: #334155; color: #94a3b8; border: 1px solid #475569;
    }
    #btn-reset-params:hover { background: #475569; color: #e2e8f0; }

    #params-loading { font-size: 0.78rem; color: #475569; padding: 6px 0; text-align: center; }

    /* ── Stats panel ─────────────────────────────────────────────────── */
    #stats { font-size: 0.8rem; color: #94a3b8; }
    #stats strong { color: #e2e8f0; }

    /* ── Location marker ─────────────────────────────────────────────── */
    @keyframes loc-pulse {
      0%   { transform: scale(0.5); opacity: 0.8; }
      100% { transform: scale(3);   opacity: 0; }
    }
    .loc-ring {
      position: absolute;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #3b82f6;
      animation: loc-pulse 1.8s ease-out infinite;
      top: 0; left: 0;
    }
    .loc-dot {
      position: absolute;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #3b82f6;
      border: 2px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,.4);
      top: 0; left: 0;
    }


    #map-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #map { flex: 1; min-height: 0; }

    .picking-cursor { cursor: crosshair !important; }

    /* ── Elevation profile panel ─────────────────────────────────────── */
    #profile-panel {
      flex-shrink: 0;
      background: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    #profile-panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px;
      background: #0f172a;
      user-select: none;
    }

    #profile-panel-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
      flex: 1;
    }

    .mode-btn {
      font-size: 0.72rem;
      padding: 2px 10px;
      border-radius: 3px;
      border: 1px solid #475569;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }
    .mode-btn:hover:not(.active) { background: #1e293b; }

    #btn-toggle-panel {
      font-size: 0.72rem;
      padding: 2px 8px;
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      border-radius: 3px;
    }
    #btn-toggle-panel:hover { background: #1e293b; }

    #profile-panel-body {
      position: relative;
      height: 130px;
    }
    #profile-panel.collapsed #profile-panel-body { display: none; }

    /* ── Elevation profile — selection / zoom ─────────────────────────── */
    #elev-svg { cursor: crosshair; }
    #elev-svg.selecting { cursor: ew-resize; }

    #sel-stats-card {
      display: none;
      position: absolute;
      top: 6px; left: 50px;
      background: rgba(15,23,42,0.93);
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 10px 6px 10px;
      font-size: 0.73rem;
      color: #cbd5e1;
      z-index: 10;
      gap: 14px;
      align-items: center;
      pointer-events: auto;
      white-space: nowrap;
    }
    #sel-stats-card.visible { display: flex; }
    .sel-stat { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .sel-stat-val { font-size: 0.82rem; font-weight: 600; color: #e2e8f0; }
    .sel-stat-lbl { font-size: 0.65rem; color: #64748b; }
    #btn-clear-sel {
      background: none;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #94a3b8;
      padding: 2px 6px;
      font-size: 0.7rem;
      cursor: pointer;
      line-height: 1.4;
    }
    #btn-clear-sel:hover { background: #334155; color: #e2e8f0; }

    #elev-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Hairline + tooltip */
    #elev-hairline {
      position: absolute;
      top: 0; bottom: 0;
      width: 1px;
      background: rgba(255,255,255,0.5);
      pointer-events: none;
      display: none;
    }
    #elev-tooltip {
      position: absolute;
      top: 6px;
      background: rgba(15,23,42,0.85);
      color: #e2e8f0;
      font-size: 0.72rem;
      padding: 3px 7px;
      border-radius: 3px;
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }

    /* Surface legend */
    #surface-legend {
      display: none;
      flex-wrap: wrap;
      gap: 6px 14px;
      padding: 4px 12px 6px;
      background: #0f172a;
    }
    #surface-legend.visible { display: flex; }
    .surf-item { display: flex; align-items: center; gap: 4px; font-size: 0.68rem; color: #94a3b8; }
    .surf-swatch { width: 14px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    /* ── Search box ──────────────────────────────────────────────────── */
    #search-wrap {
      position: relative;
    }
    #search-row {
      display: flex;
      gap: 6px;
    }
    #search-input {
      flex: 1;
      min-width: 0;
    }
    #btn-search {
      background: #334155;
      color: #cbd5e1;
      padding: 6px 10px;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    #btn-search:hover { background: #475569; }

    #search-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      z-index: 2000;
      max-height: 260px;
      overflow-y: auto;
    }
    #search-dropdown.open { display: block; }
    .search-item {
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid #0f172a;
      font-size: 0.82rem;
      color: #cbd5e1;
      line-height: 1.3;
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover,
    .search-item.active { background: #334155; }
    .search-item-sub {
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 2px;
    }
    .search-none {
      padding: 8px 10px;
      font-size: 0.82rem;
      color: #64748b;
    }

    /* Popup "Add as waypoint" button */
    .popup-add-btn {
      margin-top: 6px;
      padding: 5px 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      width: 100%;
    }
    .popup-add-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<div id="sidebar">
  <button id="sidebar-toggle" title="Collapse sidebar">‹</button>
  <div id="sidebar-content">

  <!-- Search -->
  <div id="search-wrap">
    <div id="search-row">
      <input type="text" id="search-input" placeholder="Search place or address…" autocomplete="off" />
      <button id="btn-search" title="Search">⌕</button>
    </div>
    <div id="search-dropdown"></div>
  </div>

  <!-- Waypoint controls -->
  <div id="waypoint-controls">
    <button id="btn-add-waypoint">+ Add waypoint</button>
    <button id="btn-reverse" disabled title="Reverse route order">⇅ Reverse</button>
    <button id="btn-clear-all" disabled title="Remove all waypoints">✕ Clear</button>
  </div>
  <div id="waypoint-list"></div>

  <!-- Profile -->
  <div class="field">
    <label>Profile</label>
    <select id="profile">
      {% for p in profiles %}
      <option value="{{ p }}" {% if p == 'trekking' %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </div>

  <!-- Profile settings (collapsible, dynamic) -->
  <details id="profile-settings">
    <summary>
      Profile settings
      <span id="changed-badge" style="display:none; font-size:0.7rem; background:#2563eb; color:white; border-radius:10px; padding:1px 7px;">changed</span>
    </summary>
    <div id="profile-settings-body">
      <div id="params-loading">Loading…</div>
    </div>
    <div style="padding: 4px 10px 10px;">
      <button id="btn-reset-params">Reset to defaults</button>
    </div>
  </details>

  <!-- Alternative -->
  <div class="field">
    <label>Alternative route</label>
    <select id="alternativeidx">
      <option value="0">0 — primary</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
    </select>
  </div>

  <!-- Output format -->
  <div class="field">
    <label>Download format</label>
    <select id="format">
      <option value="gpx">GPX</option>
      <option value="geojson">GeoJSON</option>
      <option value="kml">KML</option>
      <option value="csv">CSV</option>
    </select>
  </div>

  <!-- Track name -->
  <div class="field">
    <label>Track name</label>
    <input type="text" id="trackname" />
  </div>

  <!-- Actions -->
  <button id="btn-download" disabled>Download Route</button>

  <div id="status" class="status"></div>

  <!-- Stats -->
  <div id="stats" style="display:none;">
    <strong>Route info</strong>
    <div id="stats-body"></div>
  </div>

  </div><!-- /#sidebar-content -->
</div>

<!-- Map column: map + elevation panel -->
<div id="map-column">
  <div id="map"></div>

  <div id="profile-panel" class="collapsed">
    <!-- Header -->
    <div id="profile-panel-header">
      <span id="profile-panel-title">Elevation profile</span>
      <button class="mode-btn active" id="btn-mode-gradient">Gradient</button>
      <button class="mode-btn"        id="btn-mode-surface">Surface</button>
      <button id="btn-toggle-panel">▲ Show</button>
    </div>
    <!-- Chart -->
    <div id="profile-panel-body">
      <svg id="elev-svg"></svg>
      <div id="elev-hairline"></div>
      <div id="elev-tooltip"></div>
      <div id="sel-stats-card"></div>
    </div>
    <!-- Surface legend -->
    <div id="surface-legend"></div>
  </div>
</div>

<script>
  // ── Map setup ──────────────────────────────────────────────────────────────
  const map = L.map('map', { doubleClickZoom: true }).setView([51.0, 10.0], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
  }).addTo(map);

  // Centre on current location at startup
  map.locate({ setView: true, maxZoom: 13 });
  map.on('locationerror', () => { /* keep default view on error */ });

  // ── State ──────────────────────────────────────────────────────────────────
  let waypoints    = [];   // [{lat, lon, marker: L.Marker}]
  let undoStack    = [];   // array of [{lat,lon}[]] snapshots (max 50)
  let addingMode   = false;
  let routeLayer   = null;
  let routeHitLayer = null; // transparent wide polyline for easier hover
  let routeGeom    = null; // dense [{lat, lon, cumDist}] from geometry coordinates
  let routeWpSegs  = null; // routeGeom index of each waypoint (for insertion)
  let elevData     = null;
  let elevMode     = 'gradient'; // 'gradient' | 'surface' | 'highway' | 'tracktype'
  let elevSelection = null;      // { distStart, distEnd } or null (profile zoom)
  let selectionLayer = null;     // L.layerGroup overlay for the selected segment
  let selStartMarker = null;     // L.circleMarker at selection start
  let selEndMarker   = null;     // L.circleMarker at selection end
  let routeSegments  = null;     // [{latlngs,category,cumDistStart,cumDistEnd}] from buildSurfaceLines
  let routeBounds    = null;     // full route L.LatLngBounds (for zoom-out)
  let profileParams = [];
  let hoverMarker  = null;
  let routeTimer   = null; // debounce handle for auto-route
  let clickTimer   = null; // guard against dblclick zoom
  let dragSrcIdx   = null; // index of row being dragged
  let locationMarker   = null;
  let locationAccCircle = null;
  let legCache     = [];   // legCache[i]: cached GeoJSON for wp[i]→wp[i+1], null = needs fetch
  let lastRouteKey = '';   // detects profile/params changes → invalidates all legs

  // ── Marker icons ───────────────────────────────────────────────────────────
  function makeIcon(color, size) {
    return L.divIcon({
      className: '',
      html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>`,
      iconSize:   [size, size],
      iconAnchor: [size / 2, size / 2],
    });
  }

  function makeHighlightIcon(color, size) {
    const s = size + 6;
    return L.divIcon({
      className: '',
      html: `<div style="width:${s}px;height:${s}px;border-radius:50%;background:${color};border:3px solid white;box-shadow:0 0 0 2px ${color},0 2px 8px rgba(0,0,0,.5)"></div>`,
      iconSize:   [s, s],
      iconAnchor: [s / 2, s / 2],
    });
  }

  function makeLocationIcon() {
    return L.divIcon({
      className: '',
      html: '<div class="loc-ring"></div><div class="loc-dot"></div>',
      iconSize:   [14, 14],
      iconAnchor: [7, 7],
    });
  }

  function iconForIndex(i) {
    const n = waypoints.length;
    if (i === 0)     return makeIcon('#16a34a', 14); // green start
    if (i === n - 1) return makeIcon('#dc2626', 14); // red end
    return makeIcon('#64748b', 10);                  // grey via
  }

  function refreshAllIcons() {
    waypoints.forEach((w, i) => w.marker.setIcon(iconForIndex(i)));
  }

  // ── Undo stack ─────────────────────────────────────────────────────────────
  function snapshot() {
    return waypoints.map(w => ({ lat: w.lat, lon: w.lon }));
  }

  function pushUndo() {
    undoStack.push(snapshot());
    if (undoStack.length > 50) undoStack.shift();
  }

  function undo() {
    if (!undoStack.length) return;
    const snap = undoStack.pop();
    waypoints.forEach(w => map.removeLayer(w.marker));
    waypoints = [];
    for (const { lat, lon } of snap) _addWaypointRaw(lat, lon);
    legCache = new Array(Math.max(0, waypoints.length - 1)).fill(null);
    refreshAllIcons();
    renderWaypointList();
    scheduleRoute();
  }

  // ── Core waypoint operations ───────────────────────────────────────────────

  /** Internal: add a waypoint without touching the undo stack. */
  function _addWaypointRaw(lat, lon) {
    const wp = { lat, lon, marker: null };
    waypoints.push(wp);
    const marker = L.marker([lat, lon], {
      icon: makeIcon('#64748b', 10), // refreshed afterwards
      draggable: true,
    }).addTo(map);
    marker.on('dragend', () => {
      pushUndo();
      const ll = marker.getLatLng();
      wp.lat = ll.lat;
      wp.lon = ll.lng;
      // Invalidate the legs touching this waypoint
      const idx = waypoints.indexOf(wp);
      if (idx > 0)                    legCache[idx - 1] = null;
      if (idx < waypoints.length - 1) legCache[idx]     = null;
      refreshAllIcons();
      renderWaypointList();
      scheduleRoute();
    });
    marker.on('mouseover', () => {
      const i = waypoints.indexOf(wp);
      if (i >= 0) highlightWaypoint(i);
    });
    marker.on('mouseout', () => {
      const i = waypoints.indexOf(wp);
      if (i >= 0) unhighlightWaypoint(i);
    });
    wp.marker = marker;
    return wp;
  }

  function addWaypoint(lat, lon) {
    pushUndo();
    _addWaypointRaw(lat, lon);
    legCache.push(null); // new leg: previous last wp → new wp
    refreshAllIcons();
    renderWaypointList();
    scheduleRoute();
  }

  function removeWaypoint(i) {
    pushUndo();
    const n = waypoints.length;
    if (i === 0)       legCache.splice(0, 1);          // drop leg 0→1; leg 1→2 shifts to 0
    else if (i === n-1) legCache.splice(n - 2, 1);     // drop last leg
    else { legCache.splice(i, 1); legCache[i - 1] = null; } // replace two legs with one
    map.removeLayer(waypoints[i].marker);
    waypoints.splice(i, 1);
    refreshAllIcons();
    renderWaypointList();
    scheduleRoute();
  }

  function reverseWaypoints() {
    if (waypoints.length < 2) return;
    pushUndo();
    waypoints.reverse();
    legCache = new Array(waypoints.length - 1).fill(null); // reversed legs are different routes
    waypoints.forEach(w => w.marker.setLatLng([w.lat, w.lon]));
    refreshAllIcons();
    renderWaypointList();
    scheduleRoute();
  }

  function clearAllWaypoints() {
    if (!waypoints.length) return;
    pushUndo();
    waypoints.forEach(w => map.removeLayer(w.marker));
    waypoints = [];
    legCache = [];
    renderWaypointList();
    if (routeLayer)    { map.removeLayer(routeLayer);    routeLayer    = null; }
    if (routeHitLayer) { map.removeLayer(routeHitLayer); routeHitLayer = null; }
    routeGeom = null; routeWpSegs = null;
    removeSelectionOverlay();
    elevSelection = null; routeBounds = null; routeSegments = null;
    fitRouteControl.setEnabled(false);
    document.getElementById('stats').style.display = 'none';
    setStatus('', '');
    clearElevationProfile();
  }

  // ── Waypoint list rendering ────────────────────────────────────────────────
  // ── Highlight helpers ──────────────────────────────────────────────────────
  function highlightWaypoint(i) {
    const rows = document.querySelectorAll('#waypoint-list .wp-row');
    if (rows[i]) rows[i].classList.add('highlighted');
    const w = waypoints[i];
    if (w) {
      const [color, size] = wpColorSize(i);
      w.marker.setIcon(makeHighlightIcon(color, size));
    }
  }

  function unhighlightWaypoint(i) {
    const rows = document.querySelectorAll('#waypoint-list .wp-row');
    if (rows[i]) rows[i].classList.remove('highlighted');
    if (waypoints[i]) waypoints[i].marker.setIcon(iconForIndex(i));
  }

  function wpColorSize(i) {
    const n = waypoints.length;
    if (i === 0)     return ['#16a34a', 14];
    if (i === n - 1) return ['#dc2626', 14];
    return ['#64748b', 10];
  }

  function renderWaypointList() {
    const list = document.getElementById('waypoint-list');
    list.innerHTML = '';
    const n = waypoints.length;

    waypoints.forEach((w, i) => {
      const color = i === 0 ? '#16a34a' : i === n - 1 ? '#dc2626' : '#64748b';
      const large = (i === 0 || i === n - 1);
      const row = document.createElement('div');
      row.className = 'wp-row';
      row.dataset.idx = i;
      row.draggable = true;
      row.innerHTML = `
        <div class="wp-handle" title="Drag to reorder">⠿</div>
        <div class="wp-dot${large ? ' large' : ''}" style="background:${color}"></div>
        <div class="wp-coords">${w.lat.toFixed(5)}, ${w.lon.toFixed(5)}</div>
        <div class="wp-btns">
          <button data-action="rm" data-idx="${i}" title="Remove">✕</button>
        </div>`;

      // ── Hover highlight ──────────────────────────────────────────────
      row.addEventListener('mouseenter', () => { if (dragSrcIdx === null) highlightWaypoint(i); });
      row.addEventListener('mouseleave', () => unhighlightWaypoint(i));

      // ── HTML5 drag-and-drop ──────────────────────────────────────────
      row.addEventListener('dragstart', e => {
        dragSrcIdx = i;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        // Firefox requires some data to be set
        e.dataTransfer.setData('text/plain', i);
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        document.querySelectorAll('.wp-row.drag-over').forEach(r => r.classList.remove('drag-over'));
        dragSrcIdx = null;
      });
      row.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        // Show insertion indicator only on rows other than the source
        document.querySelectorAll('.wp-row.drag-over').forEach(r => r.classList.remove('drag-over'));
        if (i !== dragSrcIdx) row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', () => {
        row.classList.remove('drag-over');
      });
      row.addEventListener('drop', e => {
        e.preventDefault();
        row.classList.remove('drag-over');
        if (dragSrcIdx === null || dragSrcIdx === i) return;
        pushUndo();
        // Move dragSrcIdx to position i
        const [moved] = waypoints.splice(dragSrcIdx, 1);
        waypoints.splice(i, 0, moved);
        // Reorder changes the legs touched by both src and dest positions
        legCache = new Array(waypoints.length - 1).fill(null);
        // Sync all marker positions (positions didn't change, only order in array)
        refreshAllIcons();
        renderWaypointList();
        scheduleRoute();
      });

      list.appendChild(row);
    });

    // Update toolbar button states
    document.getElementById('btn-reverse').disabled   = n < 2;
    document.getElementById('btn-clear-all').disabled = n === 0;
  }

  // Event delegation — only remove button remains
  document.getElementById('waypoint-list').addEventListener('click', e => {
    const btn = e.target.closest('button[data-action="rm"]');
    if (!btn) return;
    removeWaypoint(parseInt(btn.dataset.idx, 10));
  });

  // ── Map click — add waypoint (with dblclick guard) ─────────────────────────
  map.on('click', e => {
    if (!addingMode) return;
    // If a timer is already running, a second click arrived quickly → it's a
    // dblclick sequence. Cancel the pending add and do nothing (let map zoom).
    if (clickTimer) {
      clearTimeout(clickTimer);
      clickTimer = null;
      return;
    }
    const { lat, lng } = e.latlng;
    clickTimer = setTimeout(() => {
      clickTimer = null;
      addWaypoint(lat, lng);
    }, 250);
  });

  // Belt-and-suspenders: if Leaflet fires dblclick, cancel any pending add.
  map.on('dblclick', () => {
    if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
  });

  // ── Add-waypoint button ────────────────────────────────────────────────────
  document.getElementById('btn-add-waypoint').addEventListener('click', () => {
    addingMode = !addingMode;
    document.getElementById('btn-add-waypoint').classList.toggle('active', addingMode);
    map.getContainer().classList.toggle('picking-cursor', addingMode);
    setStatus(addingMode ? 'Click on the map to add waypoints. Press Esc to stop.' : '', addingMode ? 'info' : '');
  });

  // ── Reverse / Clear-all buttons ────────────────────────────────────────────
  document.getElementById('btn-reverse').addEventListener('click', reverseWaypoints);
  document.getElementById('btn-clear-all').addEventListener('click', clearAllWaypoints);

  // ── Keyboard: Esc exits adding mode; Ctrl/Cmd-Z undoes ────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      addingMode = false;
      document.getElementById('btn-add-waypoint').classList.remove('active');
      map.getContainer().classList.remove('picking-cursor');
      setStatus('', '');
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
      e.preventDefault();
      undo();
    }
  });

  // ── Status ─────────────────────────────────────────────────────────────────
  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status' + (type ? ' ' + type : '');
  }

  // ── Profile params / localStorage ─────────────────────────────────────────
  function storageKey(profile) { return `brouter-params:${profile}`; }

  function saveProfileOverrides(profile) {
    const saved = {};
    document.querySelectorAll('[data-param]').forEach(input => {
      if (isChanged(input))
        saved[input.dataset.param] = input.type === 'checkbox' ? input.checked : input.value;
    });
    if (Object.keys(saved).length)
      localStorage.setItem(storageKey(profile), JSON.stringify(saved));
    else
      localStorage.removeItem(storageKey(profile));
  }

  function loadedOverrides(profile) {
    try { return JSON.parse(localStorage.getItem(storageKey(profile))) || {}; }
    catch { return {}; }
  }

  function isChanged(input) {
    if (input.type === 'checkbox')
      return input.checked !== (input.dataset.default === 'true');
    return String(input.value) !== String(input.dataset.default);
  }

  async function loadProfileParams(profile) {
    const body = document.getElementById('profile-settings-body');
    body.innerHTML = '<div id="params-loading">Loading…</div>';
    updateChangedBadge();
    try {
      const resp = await fetch(`/profile-params/${encodeURIComponent(profile)}`);
      profileParams = await resp.json();
    } catch {
      body.innerHTML = '<div id="params-loading" style="color:#fca5a5">Failed to load params.</div>';
      return;
    }
    renderProfileParams(profile);
  }

  function renderProfileParams(profile) {
    const body = document.getElementById('profile-settings-body');
    if (!profileParams.length) {
      body.innerHTML = '<div id="params-loading">No configurable parameters.</div>';
      return;
    }
    const saved = loadedOverrides(profile);
    body.innerHTML = '';
    for (const p of profileParams) {
      const row = document.createElement('div');
      const savedVal = saved[p.name];
      if (p.kind === 'boolean') {
        const checked = savedVal !== undefined ? savedVal : p.default;
        row.className = 'param-row bool-row';
        row.innerHTML = `
          <label for="param-${p.name}" title="${p.description}">${p.name}</label>
          <input type="checkbox" id="param-${p.name}" data-param="${p.name}" data-default="${p.default}"
            ${checked ? 'checked' : ''} />`;
      } else if (p.kind === 'number') {
        const val = savedVal !== undefined ? savedVal : p.default;
        row.className = 'param-row';
        row.innerHTML = `
          <label for="param-${p.name}">${p.name}</label>
          <div class="param-desc">${p.description}</div>
          <input type="number" id="param-${p.name}" data-param="${p.name}" data-default="${p.default}"
            value="${val}" step="any" />`;
      } else if (p.kind === 'enum') {
        const val = savedVal !== undefined ? savedVal : p.default;
        const opts = p.options.map(o =>
          `<option value="${o.value}" ${String(o.value) === String(val) ? 'selected' : ''}>${o.value} — ${o.label}</option>`
        ).join('');
        row.className = 'param-row';
        row.innerHTML = `
          <label for="param-${p.name}">${p.name}</label>
          <div class="param-desc">${p.description}</div>
          <select id="param-${p.name}" data-param="${p.name}" data-default="${p.default}">${opts}</select>`;
      } else {
        const val = savedVal !== undefined ? savedVal : p.default;
        row.className = 'param-row';
        row.innerHTML = `
          <label for="param-${p.name}">${p.name}</label>
          <input type="text" id="param-${p.name}" data-param="${p.name}" data-default="${p.default}"
            value="${val}" />`;
      }
      body.appendChild(row);
      const input = row.querySelector('[data-param]');
      if (isChanged(input)) row.classList.add('param-changed');
      input.addEventListener('change', () => {
        row.classList.toggle('param-changed', isChanged(input));
        saveProfileOverrides(profile);
        updateChangedBadge();
        // Re-route with new profile settings
        scheduleRoute();
      });
    }
    updateChangedBadge();
  }

  function updateChangedBadge() {
    document.getElementById('changed-badge').style.display =
      getProfileOverrides().length > 0 ? 'inline' : 'none';
  }

  function getProfileOverrides() {
    const overrides = [];
    document.querySelectorAll('[data-param]').forEach(input => {
      if (!isChanged(input)) return;
      const value = input.type === 'checkbox' ? (input.checked ? '1' : '0') : input.value;
      overrides.push([`profile:${input.dataset.param}`, value]);
    });
    return overrides;
  }

  document.getElementById('btn-reset-params').addEventListener('click', () => {
    const profile = document.getElementById('profile').value;
    document.querySelectorAll('[data-param]').forEach(input => {
      if (input.type === 'checkbox') input.checked = input.dataset.default === 'true';
      else input.value = input.dataset.default;
      input.closest('.param-row').classList.remove('param-changed');
    });
    localStorage.removeItem(storageKey(profile));
    updateChangedBadge();
    scheduleRoute();
  });

  // ── Track name default ────────────────────────────────────────────────────
  function defaultTrackName() {
    const profile = document.getElementById('profile').value;
    const now     = new Date();
    const date    = now.toLocaleDateString('sv');                          // YYYY-MM-DD
    const time    = now.toTimeString().slice(0, 5).replace(':', 'h');     // HHhMM
    return `${profile}-${date}-${time}`;
  }

  function refreshTrackName() {
    document.getElementById('trackname').value = defaultTrackName();
  }

  refreshTrackName();
  loadProfileParams(document.getElementById('profile').value);
  document.getElementById('profile').addEventListener('change', e => {
    refreshTrackName();
    loadProfileParams(e.target.value);
    scheduleRoute();
  });
  document.getElementById('alternativeidx').addEventListener('change', scheduleRoute);

  // ── Build route query params ───────────────────────────────────────────────
  function buildRouteParams(lonlats, fmt) {
    const params = new URLSearchParams({
      lonlats,
      profile: document.getElementById('profile').value,
      alternativeidx: document.getElementById('alternativeidx').value,
    });
    if (fmt) params.set('format', fmt);
    for (const [k, v] of getProfileOverrides()) params.append(k, v);
    return params;
  }

  function currentLonlats() {
    return waypoints.map(w => `${w.lon.toFixed(6)},${w.lat.toFixed(6)}`).join('|');
  }

  // ── Route key: detects profile/params changes that invalidate all legs ────
  function routeKey() {
    const overrides = [...getProfileOverrides()].map(([k, v]) => `${k}=${v}`).join(',');
    return `${document.getElementById('profile').value}|${document.getElementById('alternativeidx').value}|${overrides}`;
  }

  // ── Fetch a single leg (wp[i] → wp[i+1]) from BRouter ────────────────────
  async function fetchLeg(i) {
    const lonlats = `${waypoints[i].lon.toFixed(6)},${waypoints[i].lat.toFixed(6)}|${waypoints[i+1].lon.toFixed(6)},${waypoints[i+1].lat.toFixed(6)}`;
    const resp = await fetch(`/route?${buildRouteParams(lonlats, null)}`);
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Routing failed');
    return data;
  }

  // ── Stitch cached legs into one GeoJSON-like object ───────────────────────
  function stitchLegs(legs) {
    if (legs.length === 1) return legs[0];

    let allCoords   = [];
    let allMessages = null;
    let totalLength = 0, totalTime = 0, totalEnergy = 0;

    for (let i = 0; i < legs.length; i++) {
      const feat   = legs[i].features[0];
      const coords = feat.geometry.coordinates;
      const msgs   = feat.properties.messages;
      const props  = feat.properties;

      // Merge coords — skip first point of subsequent legs (duplicate junction)
      allCoords = i === 0 ? [...coords] : [...allCoords, ...coords.slice(1)];

      // Merge messages — keep header from first leg, data rows from all
      if (msgs && msgs.length > 1) {
        if (!allMessages) allMessages = [msgs[0]];
        allMessages.push(...msgs.slice(1));
      }

      totalLength += parseFloat(props['track-length']) || 0;
      totalTime   += parseFloat(props['total-time'])   || 0;
      totalEnergy += parseFloat(props['total-energy']) || 0;
    }

    return {
      type: 'FeatureCollection',
      features: [{
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: allCoords },
        properties: {
          messages:       allMessages,
          'track-length': totalLength,
          'total-time':   totalTime,
          'total-energy': totalEnergy,
        },
      }],
    };
  }

  // ── Render a complete stitched route onto the map ─────────────────────────
  function renderRoute(data, fitBounds) {
    if (routeLayer)    { map.removeLayer(routeLayer);    routeLayer    = null; }
    if (routeHitLayer) { map.removeLayer(routeHitLayer); routeHitLayer = null; }

    const segments   = buildSurfaceLines(data);
    routeSegments    = segments;
    const geomCoords = data.features?.[0]?.geometry?.coordinates;
    const allLatLngs = geomCoords ? geomCoords.map(c => [c[1], c[0]]) : [];
    if (allLatLngs.length) { routeBounds = L.latLngBounds(allLatLngs); fitRouteControl.setEnabled(true); }

    if (segments) {
      const casings = segments.map(({ latlngs, category }) => L.polyline(latlngs, {
        color: 'rgba(0,0,0,0.45)', weight: category === 'unpaved' ? 5 : 6,
        opacity: category === 'unknown' ? 0.45 : 1,
        lineCap: 'round', lineJoin: 'round', interactive: false,
      }));
      const fills = segments.map(({ latlngs, category }) => L.polyline(latlngs, {
        color:     category === 'unpaved' ? '#fbbf24' : '#3b82f6',
        weight:    3, opacity: category === 'unknown' ? 0.5 : 0.92,
        dashArray: category === 'unpaved' ? '8, 8' : null,
        lineCap: 'butt', lineJoin: 'round', interactive: false,
      }));
      routeLayer = L.layerGroup([...casings, ...fills]).addTo(map);
    } else {
      const casing = L.geoJSON(data, { style: { color: 'rgba(0,0,0,0.45)', weight: 6 }, interactive: false });
      const fill   = L.geoJSON(data, { style: { color: '#3b82f6', weight: 3, opacity: 0.92 }, interactive: false });
      routeLayer = L.layerGroup([casing, fill]).addTo(map);
    }

    routeGeom = null;
    if (geomCoords && geomCoords.length >= 2) {
      let cum = 0;
      routeGeom = geomCoords.map((c, i) => {
        if (i > 0) {
          const [lon1, lat1] = geomCoords[i - 1], [lon2, lat2] = c;
          const dLat = (lat2 - lat1) * 111320;
          const dLon = (lon2 - lon1) * 111320 * Math.cos((lat1 + lat2) / 2 * Math.PI / 180);
          cum += Math.sqrt(dLat * dLat + dLon * dLon);
        }
        return { lat: c[1], lon: c[0], cumDist: cum };
      });
      routeWpSegs = waypoints.map(w => {
        let best = 0, bestD = Infinity;
        for (let i = 0; i < routeGeom.length; i++) {
          const d = (routeGeom[i].lat - w.lat) ** 2 + (routeGeom[i].lon - w.lon) ** 2;
          if (d < bestD) { bestD = d; best = i; }
        }
        return best;
      });
    }

    if (allLatLngs.length) {
      routeHitLayer = L.polyline(allLatLngs, { weight: 20, opacity: 0.001, interactive: true }).addTo(map);
      routeHitLayer.on('mousemove', onRouteMouseMove);
      routeHitLayer.on('mouseout',  onRouteMouseOut);
      routeHitLayer.on('mousedown', onRouteMouseDown);
    }

    if (fitBounds && allLatLngs.length)
      map.fitBounds(L.latLngBounds(allLatLngs), { padding: [30, 30] });

    showStats(data?.features?.[0]?.properties ?? {}, data);
    document.getElementById('btn-download').disabled = false;
    drawElevationProfile(data);
  }

  // ── Auto-route with debounce ───────────────────────────────────────────────
  function scheduleRoute() {
    if (routeTimer) { clearTimeout(routeTimer); routeTimer = null; }
    if (waypoints.length < 2) {
      if (routeLayer)    { map.removeLayer(routeLayer);    routeLayer    = null; }
      if (routeHitLayer) { map.removeLayer(routeHitLayer); routeHitLayer = null; }
      routeGeom = null; routeWpSegs = null;
      removeSelectionOverlay();
      elevSelection = null; routeBounds = null; routeSegments = null;
      fitRouteControl.setEnabled(false);
      document.getElementById('btn-download').disabled = true;
      document.getElementById('stats').style.display = 'none';
      clearElevationProfile();
      return;
    }
    routeTimer = setTimeout(calculateRoute, 300);
  }

  async function calculateRoute() {
    const n = waypoints.length;
    if (n < 2) return;

    // Detect profile/params change → invalidate entire cache
    const key = routeKey();
    if (key !== lastRouteKey) { lastRouteKey = key; legCache = new Array(n - 1).fill(null); }

    // Ensure legCache is the right length (pad with null if waypoints were added)
    while (legCache.length < n - 1) legCache.push(null);
    legCache.length = n - 1;

    const nullIdxs = legCache.reduce((acc, v, i) => { if (v === null) acc.push(i); return acc; }, []);
    if (!nullIdxs.length) {
      // All legs cached — just re-stitch and re-render (e.g. after resize)
      renderRoute(stitchLegs(legCache), false);
      setStatus('Route calculated.', 'ok');
      return;
    }

    const wasEmpty = !routeLayer;
    setStatus(`Calculating… (${nullIdxs.length} leg${nullIdxs.length > 1 ? 's' : ''})`, 'info');
    removeSelectionOverlay();
    elevSelection = null; routeSegments = null;
    hideSelStats();

    try {
      // Fetch all stale legs in parallel
      await Promise.all(nullIdxs.map(async i => {
        legCache[i] = await fetchLeg(i);
      }));

      renderRoute(stitchLegs(legCache), wasEmpty);
      setStatus('Route calculated.', 'ok');
    } catch (err) {
      // Mark failed legs as null so they retry next time
      nullIdxs.forEach(i => { if (legCache[i] === null) legCache[i] = null; });
      setStatus('Network error: ' + err.message, 'error');
    }
  }

  // ── Stats ─────────────────────────────────────────────────────────────────
  const PAVED_SURFACES   = new Set(['asphalt','concrete','paved','paving_stones','sett','cobblestone','metal','wood']);
  const UNPAVED_SURFACES = new Set(['gravel','fine_gravel','compacted','pebblestone','unpaved',
                                    'dirt','ground','grass','mud','earth','grass_paver','sand']);
  const PAVED_HIGHWAYS   = new Set(['motorway','trunk','primary','secondary','tertiary',
                                    'residential','unclassified','service','living_street','road']);
  const UNPAVED_HIGHWAYS = new Set(['track','bridleway']);

  function surfaceCategory(tags) {
    if (tags.surface) {
      if (PAVED_SURFACES.has(tags.surface))   return 'paved';
      if (UNPAVED_SURFACES.has(tags.surface)) return 'unpaved';
    }
    if (tags.tracktype && tags.tracktype !== 'grade1') return 'unpaved';
    if (tags.tracktype === 'grade1')                   return 'paved';
    if (tags.highway) {
      if (PAVED_HIGHWAYS.has(tags.highway))   return 'paved';
      if (UNPAVED_HIGHWAYS.has(tags.highway)) return 'unpaved';
      if (tags.highway === 'cycleway' || tags.highway === 'path' || tags.highway === 'footway')
        return 'paved';
    }
    return 'unknown';
  }

  /**
   * Split the route geometry into runs of the same surface category.
   * Returns [{latlngs: [[lat,lon],...], category: 'paved'|'unpaved'|'unknown'}]
   * or null if data is insufficient.
   */
  function buildSurfaceLines(geojson) {
    const coords = geojson?.features?.[0]?.geometry?.coordinates;
    const msgs   = geojson?.features?.[0]?.properties?.messages;
    if (!coords || coords.length < 2 || !msgs || msgs.length < 2) return null;

    const cols  = msgs[0];
    const iDist = cols.indexOf('Distance');
    const iWay  = cols.indexOf('WayTags');
    if (iDist < 0) return null;

    // Build message boundaries: cumulative distance → surface category.
    // Each boundary marks the END of a segment with that category.
    const boundaries = [];
    let cum = 0;
    for (let r = 1; r < msgs.length; r++) {
      cum += parseInt(msgs[r][iDist], 10) || 0;
      const tags = iWay >= 0 ? parseTags(msgs[r][iWay]) : {};
      boundaries.push({ cumDist: cum, category: surfaceCategory(tags) });
    }

    // Compute cumulative distances along geometry coordinates
    const geomCum = new Float64Array(coords.length);
    for (let i = 1; i < coords.length; i++) {
      const [lon1, lat1] = coords[i - 1];
      const [lon2, lat2] = coords[i];
      const dLat = (lat2 - lat1) * 111320;
      const dLon = (lon2 - lon1) * 111320 * Math.cos((lat1 + lat2) / 2 * Math.PI / 180);
      geomCum[i] = geomCum[i - 1] + Math.sqrt(dLat * dLat + dLon * dLon);
    }

    // For a given cumulative distance, return the surface category of the
    // message segment that contains it (binary search on boundaries).
    function categoryAt(d) {
      let lo = 0, hi = boundaries.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (boundaries[mid].cumDist < d) lo = mid + 1; else hi = mid;
      }
      return boundaries[lo].category;
    }

    // Walk geometry coords, grouping runs of the same category.
    // Each transition point is shared between the ending and starting segment
    // so the line has no gaps.
    const segments = [];
    let curCat     = categoryAt(geomCum[0]);
    let curPts     = [[coords[0][1], coords[0][0]]];
    let curStart   = geomCum[0];

    for (let i = 1; i < coords.length; i++) {
      const cat = categoryAt(geomCum[i]);
      if (cat === curCat) {
        curPts.push([coords[i][1], coords[i][0]]);
      } else {
        curPts.push([coords[i][1], coords[i][0]]);
        segments.push({ latlngs: curPts, category: curCat, cumDistStart: curStart, cumDistEnd: geomCum[i] });
        curCat   = cat;
        curPts   = [[coords[i][1], coords[i][0]]];
        curStart = geomCum[i];
      }
    }
    segments.push({ latlngs: curPts, category: curCat, cumDistStart: curStart, cumDistEnd: geomCum[geomCum.length - 1] });
    return segments;
  }

  function computeRouteStats(geojson) {
    const msgs   = geojson?.features?.[0]?.properties?.messages;
    const coords = geojson?.features?.[0]?.geometry?.coordinates;
    if (!msgs || msgs.length < 2) return null;

    const cols  = msgs[0];
    const iDist = cols.indexOf('Distance');
    const iWay  = cols.indexOf('WayTags');
    if (iDist < 0) return null;

    // ── Surface breakdown from messages (sparse, has WayTags) ────────────
    let pavedM = 0, unpavedM = 0, unknownM = 0;
    for (let r = 1; r < msgs.length; r++) {
      const row  = msgs[r];
      const dist = parseInt(row[iDist], 10) || 0;
      const tags = iWay >= 0 ? parseTags(row[iWay]) : {};
      const cat  = surfaceCategory(tags);
      if      (cat === 'paved')   pavedM   += dist;
      else if (cat === 'unpaved') unpavedM += dist;
      else                        unknownM += dist;
    }

    // ── Elevation gain/loss + grade from geometry coords (dense, fractional elev) ──
    let gainM = 0, lossM = 0;
    let maxGrade = -Infinity, minGrade = Infinity;
    if (coords && coords.length >= 2) {
      const cumDist = new Float64Array(coords.length);
      for (let i = 1; i < coords.length; i++) {
        const [lon1, lat1] = coords[i - 1];
        const [lon2, lat2] = coords[i];
        const dLat = (lat2 - lat1) * 111320;
        const dLon = (lon2 - lon1) * 111320 * Math.cos((lat1 + lat2) / 2 * Math.PI / 180);
        cumDist[i] = cumDist[i - 1] + Math.sqrt(dLat * dLat + dLon * dLon);
        const dElev = coords[i][2] - coords[i - 1][2];
        if (dElev > 0) gainM += dElev;
        else           lossM += Math.abs(dElev);
      }
      // Grade over 100 m sliding window (two-pointer O(n))
      const WINDOW_M = 100;
      let j = 0;
      for (let i = 0; i < coords.length - 1; i++) {
        if (j <= i) j = i + 1;
        while (j < coords.length - 1 && cumDist[j] - cumDist[i] < WINDOW_M) j++;
        const span = cumDist[j] - cumDist[i];
        if (span < 1) continue;
        const grade = (coords[j][2] - coords[i][2]) / span * 100;
        if (grade > maxGrade) maxGrade = grade;
        if (grade < minGrade) minGrade = grade;
      }
    }

    const totalM = pavedM + unpavedM + unknownM || 1;
    return {
      pavedM, unpavedM, unknownM, totalM,
      gainM:    Math.round(gainM),
      lossM:    Math.round(lossM),
      maxGrade: isFinite(maxGrade) ? maxGrade : null,
      minGrade: isFinite(minGrade) ? minGrade : null,
    };
  }

  function showStats(props, geojson) {
    const statsDiv = document.getElementById('stats');
    const body     = document.getElementById('stats-body');
    const rows     = [];

    const fields = [
      ['Total distance', 'track-length',  m  => (m / 1000).toFixed(2) + ' km'],
      ['Est. time',      'total-time',    s  => { const h = Math.floor(s/3600), min = Math.floor((s%3600)/60); return (h ? h+'h ' : '') + min + ' min'; }],
      ['Energy',         'total-energy',  wh => (wh / 1000).toFixed(2) + ' kWh'],
    ];
    for (const [label, key, fmt] of fields)
      if (props[key] != null) rows.push(`<div>${label}: <strong>${fmt(props[key])}</strong></div>`);

    const s = geojson ? computeRouteStats(geojson) : null;
    if (s) {
      const fmt1 = v => (v / 1000).toFixed(2);
      const pct  = v => ((v / s.totalM) * 100).toFixed(1);
      rows.push(`<div>Elevation gain: <strong>${s.gainM} m</strong></div>`);
      rows.push(`<div>Elevation loss: <strong>${s.lossM} m</strong></div>`);
      if (s.maxGrade !== null)
        rows.push(`<div>Max grade: <strong>${s.maxGrade.toFixed(1)}%</strong> &nbsp; Min grade: <strong>${s.minGrade.toFixed(1)}%</strong></div>`);
      rows.push(`<div style="margin-top:4px"><strong>Surface</strong></div>`);
      rows.push(`<div>Paved: <strong>${fmt1(s.pavedM)} km</strong> <span style="color:#475569">(${pct(s.pavedM)}%)</span></div>`);
      rows.push(`<div>Unpaved: <strong>${fmt1(s.unpavedM)} km</strong> <span style="color:#475569">(${pct(s.unpavedM)}%)</span></div>`);
      if (s.unknownM > 0)
        rows.push(`<div>Unknown: <strong>${fmt1(s.unknownM)} km</strong> <span style="color:#475569">(${pct(s.unknownM)}%)</span></div>`);
    }

    body.innerHTML = rows.join('');
    statsDiv.style.display = rows.length ? 'block' : 'none';
  }

  // ── Download ──────────────────────────────────────────────────────────────
  document.getElementById('btn-download').addEventListener('click', () => {
    if (waypoints.length < 2) return;
    const fmt       = document.getElementById('format').value;
    const trackname = document.getElementById('trackname').value.trim() || defaultTrackName();
    const qs = buildRouteParams(currentLonlats(), fmt);
    qs.set('trackname', trackname);
    window.location.href = `/download?${qs}`;
  });

  // ── Location marker (persistent, updated on every locate) ────────────────
  map.on('locationfound', e => {
    if (locationMarker) {
      locationMarker.setLatLng(e.latlng);
      locationAccCircle.setLatLng(e.latlng).setRadius(e.accuracy / 2);
    } else {
      locationAccCircle = L.circle(e.latlng, {
        radius: e.accuracy / 2,
        color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.08, weight: 1,
      }).addTo(map);
      locationMarker = L.marker(e.latlng, {
        icon: makeLocationIcon(),
        zIndexOffset: -100,
        interactive: false,
      }).addTo(map);
    }
  });

  // ── My location — Leaflet map control (below zoom buttons) ───────────────
  const LocateControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd() {
      const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-locate');
      const a = L.DomUtil.create('a', '', container);
      a.href    = '#';
      a.title   = 'My location';
      a.setAttribute('role', 'button');
      a.textContent = '⊕';
      L.DomEvent.on(a, 'click', e => {
        L.DomEvent.stopPropagation(e);
        L.DomEvent.preventDefault(e);
        a.classList.add('locating');
        map.once('locationfound', () => {
          a.classList.remove('locating');
          // locationfound global handler updates the marker
        });
        map.once('locationerror', () => {
          a.classList.remove('locating');
          setStatus('Could not determine your location.', 'error');
        });
        map.locate({ setView: true, maxZoom: 15 });
      });
      return container;
    },
  });
  new LocateControl().addTo(map);

  const FitRouteControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd() {
      const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
      const a = L.DomUtil.create('a', '', container);
      a.href  = '#';
      a.title = 'Zoom to route';
      a.setAttribute('role', 'button');
      a.innerHTML = '⛶';
      a.style.fontSize = '16px';
      L.DomEvent.on(a, 'click', e => {
        L.DomEvent.stopPropagation(e);
        L.DomEvent.preventDefault(e);
        if (routeBounds) map.fitBounds(routeBounds, { padding: [30, 30], animate: true });
      });
      this._link = a;
      return container;
    },
    setEnabled(enabled) {
      this._link.style.color  = enabled ? '' : '#aaa';
      this._link.style.cursor = enabled ? 'pointer' : 'default';
    },
  });
  const fitRouteControl = new FitRouteControl().addTo(map);
  fitRouteControl.setEnabled(false);

  // ══════════════════════════════════════════════════════════════════════════
  // ── Elevation profile ─────────────────────────────────────────────────────
  // ══════════════════════════════════════════════════════════════════════════

  const SURFACE_COLORS = {
    asphalt: '#6b7280',  concrete: '#6b7280',  paved: '#6b7280',
    paving_stones: '#9ca3af', sett: '#9ca3af', cobblestone: '#9ca3af',
    gravel: '#f97316', fine_gravel: '#f97316', compacted: '#f97316',
    pebblestone: '#f97316', unpaved: '#f97316',
    dirt: '#92400e', ground: '#92400e', grass: '#92400e',
    mud: '#92400e', earth: '#92400e', grass_paver: '#92400e',
    sand: '#fde68a',
    wood: '#a16207', metal: '#9ca3af',
  };

  const HIGHWAY_COLORS = {
    cycleway: '#16a34a', path: '#16a34a', footway: '#16a34a', track: '#f97316',
    motorway: '#6b7280', trunk: '#6b7280', primary: '#6b7280',
    secondary: '#9ca3af', tertiary: '#9ca3af', residential: '#9ca3af',
    unclassified: '#9ca3af', service: '#9ca3af', living_street: '#9ca3af',
  };

  const TRACKTYPE_COLORS = {
    grade1: '#9ca3af', grade2: '#f97316', grade3: '#92400e',
    grade4: '#92400e', grade5: '#92400e',
  };

  const SURFACE_LEGEND = [
    { label: 'Asphalt / Concrete',    color: '#6b7280' },
    { label: 'Paving stones / Sett',  color: '#9ca3af' },
    { label: 'Gravel / Compacted',    color: '#f97316' },
    { label: 'Dirt / Ground / Grass', color: '#92400e' },
    { label: 'Sand',                  color: '#fde68a' },
    { label: 'Cycleway / Path',       color: '#16a34a' },
    { label: 'Unknown',               color: '#334155' },
  ];

  function parseTags(wayTagsStr) {
    const tags = {};
    for (const part of wayTagsStr.split(' ')) {
      const eq = part.indexOf('=');
      if (eq > 0) tags[part.slice(0, eq)] = part.slice(eq + 1);
    }
    return tags;
  }

  function surfaceColor(tags) {
    if (tags.surface  && SURFACE_COLORS[tags.surface])     return SURFACE_COLORS[tags.surface];
    if (tags.highway  && HIGHWAY_COLORS[tags.highway])     return HIGHWAY_COLORS[tags.highway];
    if (tags.tracktype && TRACKTYPE_COLORS[tags.tracktype]) return TRACKTYPE_COLORS[tags.tracktype];
    return '#334155';
  }

  function gradientColor(slopePct) {
    if      (slopePct <= -6) return '#1d4ed8';
    else if (slopePct <= -2) return '#60a5fa';
    else if (slopePct <   2) return '#22c55e';
    else if (slopePct <   6) return '#fbbf24';
    else if (slopePct <  10) return '#f97316';
    else                     return '#ef4444';
  }

  function parseElevData(geojson) {
    const props = geojson?.features?.[0]?.properties;
    if (!props?.messages) return null;
    const msgs = props.messages;
    const cols = msgs[0];
    const iLon  = cols.indexOf('Longitude');
    const iLat  = cols.indexOf('Latitude');
    const iElev = cols.indexOf('Elevation');
    const iDist = cols.indexOf('Distance');
    const iWay  = cols.indexOf('WayTags');
    if (iElev < 0 || iDist < 0) return null;

    const pts = [];
    let cum = 0;
    for (let r = 1; r < msgs.length; r++) {
      const row  = msgs[r];
      const dist = parseInt(row[iDist], 10) || 0;
      cum += dist;
      const elev = parseInt(row[iElev], 10);
      const lon  = iLon >= 0 ? parseInt(row[iLon], 10) / 1e6 : null;
      const lat  = iLat >= 0 ? parseInt(row[iLat], 10) / 1e6 : null;
      const tags = iWay >= 0 ? parseTags(row[iWay]) : {};
      const prevElev = pts.length ? pts[pts.length - 1].elev : elev;
      const slope = dist > 0 ? (elev - prevElev) / dist * 100 : 0;
      pts.push({
        cumDist: cum, elev, lat, lon,
        colorGradient: gradientColor(slope),
        colorSurface:  surfaceColor(tags),
      });
    }
    return pts;
  }

  const PAD_L = 42, PAD_R = 8, PAD_T = 10, PAD_B = 20;

  function drawElevationProfile(geojson) {
    elevData = parseElevData(geojson);
    if (!elevData || elevData.length < 2) return;
    const panel = document.getElementById('profile-panel');
    panel.classList.remove('collapsed');
    document.getElementById('btn-toggle-panel').textContent = '▼ Hide';
    setTimeout(() => map.invalidateSize(), 50);
    renderChart();
  }

  function renderChart() {
    if (!elevData) return;
    const svg = document.getElementById('elev-svg');
    const W = svg.clientWidth  || svg.getBoundingClientRect().width  || 800;
    const H = svg.clientHeight || svg.getBoundingClientRect().height || 130;

    const totalDist = elevData[elevData.length - 1].cumDist;
    const chartW    = W - PAD_L - PAD_R;
    const yBase     = H - PAD_B;

    // ── Piecewise x-mapping when selection is active ─────────────────────
    // Selection occupies the centre 60%; 20% context on each side.
    // Without selection: simple linear mapping.
    const sel = elevSelection;
    const d0  = sel ? sel.distStart : 0;
    const d1  = sel ? sel.distEnd   : totalDist;

    function xOf(d) {
      if (!sel) return PAD_L + (d / totalDist) * chartW;
      // piecewise: [0,d0]→20%, [d0,d1]→60%, [d1,total]→20%
      if (d <= d0) return PAD_L + (d0 > 0 ? (d / d0) * 0.20 * chartW : 0);
      if (d <= d1) return PAD_L + 0.20 * chartW + ((d - d0) / (d1 - d0)) * 0.60 * chartW;
      const tail = totalDist - d1;
      return PAD_L + 0.80 * chartW + (tail > 0 ? ((d - d1) / tail) * 0.20 * chartW : 0);
    }
    function distOf(x) {
      const rel = x - PAD_L;
      if (!sel) return (rel / chartW) * totalDist;
      if (rel <= 0.20 * chartW) return d0 > 0 ? (rel / (0.20 * chartW)) * d0 : 0;
      if (rel <= 0.80 * chartW) return d0 + ((rel - 0.20 * chartW) / (0.60 * chartW)) * (d1 - d0);
      const tail = totalDist - d1;
      return d1 + (tail > 0 ? ((rel - 0.80 * chartW) / (0.20 * chartW)) * tail : 0);
    }

    // y-axis: scale to full data always so context renders correctly
    const minElev   = Math.min(...elevData.map(p => p.elev));
    const maxElev   = Math.max(...elevData.map(p => p.elev));
    const elevRange = Math.max(maxElev - minElev, 10);
    function yOf(e) { return PAD_T + (1 - (e - minElev) / elevRange) * (H - PAD_T - PAD_B); }

    const ns = 'http://www.w3.org/2000/svg';
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    // ── Draw full profile ────────────────────────────────────────────────
    const colorKey = elevMode === 'gradient' ? 'colorGradient' : 'colorSurface';
    let prevX = xOf(0), prevY = yOf(elevData[0].elev);
    for (let i = 0; i < elevData.length; i++) {
      const pt   = elevData[i];
      const curX = xOf(pt.cumDist), curY = yOf(pt.elev);
      const poly = document.createElementNS(ns, 'polygon');
      poly.setAttribute('points', `${prevX},${yBase} ${prevX},${prevY} ${curX},${curY} ${curX},${yBase}`);
      poly.setAttribute('fill', pt[colorKey]);
      poly.setAttribute('stroke', 'none');
      svg.appendChild(poly);
      prevX = curX; prevY = curY;
    }

    // ── Y axis ───────────────────────────────────────────────────────────
    for (let i = 0; i <= 4; i++) {
      const e = minElev + (elevRange / 4) * i;
      const y = yOf(e);
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', PAD_L); line.setAttribute('x2', W - PAD_R);
      line.setAttribute('y1', y);     line.setAttribute('y2', y);
      line.setAttribute('stroke', 'rgba(255,255,255,0.07)'); line.setAttribute('stroke-width', '1');
      svg.appendChild(line);
      const txt = document.createElementNS(ns, 'text');
      txt.setAttribute('x', PAD_L - 4); txt.setAttribute('y', y + 4);
      txt.setAttribute('text-anchor', 'end'); txt.setAttribute('font-size', '9'); txt.setAttribute('fill', '#94a3b8');
      txt.textContent = Math.round(e) + 'm';
      svg.appendChild(txt);
    }

    // ── X axis ───────────────────────────────────────────────────────────
    const totalKm = totalDist / 1000;
    const xStep   = niceStep(totalKm, 5);
    for (let km = 0; km <= totalKm + xStep * 0.5; km += xStep) {
      const x = xOf(km * 1000);
      if (x > W - PAD_R + 1) break;
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', x); line.setAttribute('x2', x);
      line.setAttribute('y1', PAD_T); line.setAttribute('y2', yBase);
      line.setAttribute('stroke', 'rgba(255,255,255,0.07)'); line.setAttribute('stroke-width', '1');
      svg.appendChild(line);
      const txt = document.createElementNS(ns, 'text');
      txt.setAttribute('x', x); txt.setAttribute('y', H - 5);
      txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('font-size', '9'); txt.setAttribute('fill', '#94a3b8');
      txt.textContent = km.toFixed(km < 10 ? 1 : 0) + 'km';
      svg.appendChild(txt);
    }

    // ── Selection overlay: gray film on context zones + boundary lines ───
    if (sel) {
      const xL = xOf(d0);
      const xR = xOf(d1);
      const filmColor = 'rgba(15,23,42,0.52)';

      // Left context film
      if (xL > PAD_L) {
        const r = document.createElementNS(ns, 'rect');
        r.setAttribute('x', PAD_L); r.setAttribute('y', PAD_T);
        r.setAttribute('width', xL - PAD_L); r.setAttribute('height', H - PAD_T - PAD_B);
        r.setAttribute('fill', filmColor); r.setAttribute('pointer-events', 'none');
        svg.appendChild(r);
      }
      // Right context film
      if (xR < W - PAD_R) {
        const r = document.createElementNS(ns, 'rect');
        r.setAttribute('x', xR); r.setAttribute('y', PAD_T);
        r.setAttribute('width', W - PAD_R - xR); r.setAttribute('height', H - PAD_T - PAD_B);
        r.setAttribute('fill', filmColor); r.setAttribute('pointer-events', 'none');
        svg.appendChild(r);
      }
      // Left boundary line
      const lL = document.createElementNS(ns, 'line');
      lL.setAttribute('x1', xL); lL.setAttribute('x2', xL);
      lL.setAttribute('y1', PAD_T); lL.setAttribute('y2', yBase);
      lL.setAttribute('stroke', 'rgba(255,255,255,0.7)'); lL.setAttribute('stroke-width', '1.5');
      lL.setAttribute('pointer-events', 'none');
      svg.appendChild(lL);
      // Right boundary line
      const lR = document.createElementNS(ns, 'line');
      lR.setAttribute('x1', xR); lR.setAttribute('x2', xR);
      lR.setAttribute('y1', PAD_T); lR.setAttribute('y2', yBase);
      lR.setAttribute('stroke', 'rgba(255,255,255,0.7)'); lR.setAttribute('stroke-width', '1.5');
      lR.setAttribute('pointer-events', 'none');
      svg.appendChild(lR);
    }

    elevData._W      = W;
    elevData._H      = H;
    elevData._xOf    = xOf;
    elevData._yOf    = yOf;
    elevData._distOf = distOf;
    elevData._distMin   = 0;
    elevData._distMax   = totalDist;
    elevData._totalDist = totalDist;

    updateSurfaceLegend();
  }

  function niceStep(range, targetSteps) {
    const raw  = range / targetSteps;
    const mag  = Math.pow(10, Math.floor(Math.log10(raw)));
    const frac = raw / mag;
    let nice;
    if      (frac < 1.5) nice = 1;
    else if (frac < 3.5) nice = 2;
    else if (frac < 7.5) nice = 5;
    else                 nice = 10;
    return nice * mag;
  }

  function updateSurfaceLegend() {
    const leg = document.getElementById('surface-legend');
    if (elevMode !== 'surface') { leg.classList.remove('visible'); return; }
    leg.classList.add('visible');
    const used  = new Set(elevData.map(p => p.colorSurface));
    const items = SURFACE_LEGEND.filter(item => used.has(item.color));
    leg.innerHTML = items.map(item =>
      `<div class="surf-item"><div class="surf-swatch" style="background:${item.color}"></div>${item.label}</div>`
    ).join('');
  }

  function clearElevationProfile() {
    elevData = null;
    elevSelection = null;
    removeSelectionOverlay();
    const svg = document.getElementById('elev-svg');
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    if (hoverMarker) { map.removeLayer(hoverMarker); hoverMarker = null; }
    document.getElementById('elev-hairline').style.display = 'none';
    document.getElementById('elev-tooltip').style.display  = 'none';
    document.getElementById('surface-legend').classList.remove('visible');
    document.getElementById('sel-stats-card').classList.remove('visible');
    document.getElementById('profile-panel').classList.add('collapsed');
    document.getElementById('btn-toggle-panel').textContent = '▲ Show';
    map.invalidateSize();
  }

  // ── Shared elevation-hover helpers ───────────────────────────────────────
  const svgEl     = document.getElementById('elev-svg');
  const hairline  = document.getElementById('elev-hairline');
  const tooltip   = document.getElementById('elev-tooltip');

  /** Show the hairline + tooltip on the profile at cumulative distance `dist` (metres). */
  function showElevHover(dist) {
    if (!elevData || elevData.length < 2 || !elevData._xOf) return;
    const x = elevData._xOf(dist);

    // Binary search for surrounding points
    let lo = 0, hi = elevData.length - 1;
    while (lo < hi - 1) {
      const mid = (lo + hi) >> 1;
      if (elevData[mid].cumDist < dist) lo = mid; else hi = mid;
    }
    const a = elevData[lo], b = elevData[hi];
    const t    = b.cumDist > a.cumDist ? (dist - a.cumDist) / (b.cumDist - a.cumDist) : 0;
    const elev = a.elev + t * (b.elev - a.elev);

    hairline.style.left    = x + 'px';
    hairline.style.display = 'block';

    const km   = (dist / 1000).toFixed(2);
    tooltip.textContent = `${km} km · ${Math.round(elev)} m`;
    const svgW = svgEl.getBoundingClientRect().width;
    const tipW = 100;
    tooltip.style.left    = (x + tipW + 14 > svgW) ? (x - tipW - 6) + 'px' : (x + 10) + 'px';
    tooltip.style.display = 'block';
  }

  function hideElevHover() {
    hairline.style.display = 'none';
    tooltip.style.display  = 'none';
  }

  // ── SVG hover: profile → map marker ──────────────────────────────────────
  svgEl.addEventListener('mousemove', e => {
    if (!elevData || elevData.length < 2 || svgDragState) return;
    const rect   = svgEl.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const dMin = elevData._distMin ?? 0;
    const dMax = dMin + (elevData._totalDist ?? 0);
    const dist = Math.max(dMin, Math.min(dMax,
      elevData._distOf ? elevData._distOf(mouseX) : dMin + (dMax - dMin) * (mouseX - PAD_L) / (rect.width - PAD_L - PAD_R)
    ));
    showElevHover(dist);

    // Interpolate lat/lon for map marker
    let lo = 0, hi = elevData.length - 1;
    while (lo < hi - 1) {
      const mid = (lo + hi) >> 1;
      if (elevData[mid].cumDist < dist) lo = mid; else hi = mid;
    }
    const a = elevData[lo], b = elevData[hi];
    const t   = b.cumDist > a.cumDist ? (dist - a.cumDist) / (b.cumDist - a.cumDist) : 0;
    const lat = a.lat != null ? a.lat + t * (b.lat - a.lat) : null;
    const lon = a.lon != null ? a.lon + t * (b.lon - a.lon) : null;

    if (lat != null && lon != null) {
      if (!hoverMarker) {
        hoverMarker = L.circleMarker([lat, lon], {
          radius: 6, color: 'white', weight: 2,
          fillColor: '#f59e0b', fillOpacity: 1,
        }).addTo(map);
      } else {
        hoverMarker.setLatLng([lat, lon]);
      }
    }
  });

  svgEl.addEventListener('mouseleave', () => {
    hideElevHover();
    if (hoverMarker) { map.removeLayer(hoverMarker); hoverMarker = null; }
  });

  // ── Route hover: map → profile hairline ──────────────────────────────────
  function onRouteMouseMove(e) {
    if (!routeGeom || routeGeom.length < 2) return;
    map.getContainer().style.cursor = 'copy';
    const { lat, lng } = e.latlng;

    // Find nearest dense geometry point (1939 pts) — snaps marker to route
    let bestIdx = 0, bestDist = Infinity;
    for (let i = 0; i < routeGeom.length; i++) {
      const p = routeGeom[i];
      const d = (p.lat - lat) ** 2 + (p.lon - lng) ** 2;
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    }
    const best = routeGeom[bestIdx];
    showElevHover(best.cumDist);

    // Orange marker snapped to nearest route point (same style as profile hover)
    if (!hoverMarker) {
      hoverMarker = L.circleMarker([best.lat, best.lon], {
        radius: 6, color: 'white', weight: 2,
        fillColor: '#f59e0b', fillOpacity: 1,
        interactive: false,
      }).addTo(map);
    } else {
      hoverMarker.setLatLng([best.lat, best.lon]);
    }
  }

  function onRouteMouseOut() {
    map.getContainer().style.cursor = '';
    hideElevHover();
    if (hoverMarker) { map.removeLayer(hoverMarker); hoverMarker = null; }
  }
  function onRouteMouseDown(e) {
    if (!routeGeom || !routeWpSegs || routeGeom.length < 2) return;
    L.DomEvent.stopPropagation(e); // prevent map pan starting

    const { lat, lng } = e.latlng;

    // Nearest routeGeom point
    let bestIdx = 0, bestDist = Infinity;
    for (let i = 0; i < routeGeom.length; i++) {
      const p = routeGeom[i];
      const d = (p.lat - lat) ** 2 + (p.lon - lng) ** 2;
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    }

    // Find which segment this falls in (between waypoint i and i+1)
    let insertIdx = waypoints.length - 1; // fallback: before last
    for (let i = 0; i < routeWpSegs.length - 1; i++) {
      if (bestIdx <= routeWpSegs[i + 1]) { insertIdx = i + 1; break; }
    }

    pushUndo();

    // Remove hover marker so it doesn't flicker
    if (hoverMarker) { map.removeLayer(hoverMarker); hoverMarker = null; }
    hideElevHover();

    // Insert the new waypoint
    const snapLat = routeGeom[bestIdx].lat;
    const snapLon = routeGeom[bestIdx].lon;
    const wp = { lat: snapLat, lon: snapLon, marker: null };
    waypoints.splice(insertIdx, 0, wp);
    // legCache: leg[insertIdx-1] was wp[insertIdx-1]→wp[insertIdx], now wp[insertIdx-1]→newWp
    // A new leg[insertIdx] is needed: newWp→wp[insertIdx]
    legCache.splice(insertIdx, 0, null);        // insert slot for newWp→next
    if (insertIdx > 0) legCache[insertIdx - 1] = null; // invalidate prev leg

    const marker = L.marker([snapLat, snapLon], {
      icon: makeIcon('#64748b', 10),
      draggable: true,
    }).addTo(map);
    marker.on('dragend', () => {
      pushUndo();
      const ll = marker.getLatLng();
      wp.lat = ll.lat; wp.lon = ll.lng;
      const idx = waypoints.indexOf(wp);
      if (idx > 0)                    legCache[idx - 1] = null;
      if (idx < waypoints.length - 1) legCache[idx]     = null;
      refreshAllIcons();
      renderWaypointList();
      scheduleRoute();
    });
    marker.on('mouseover', () => { const i = waypoints.indexOf(wp); if (i >= 0) highlightWaypoint(i); });
    marker.on('mouseout',  () => { const i = waypoints.indexOf(wp); if (i >= 0) unhighlightWaypoint(i); });
    wp.marker = marker;
    refreshAllIcons();
    renderWaypointList();

    // Disable map dragging and take over pointer events for the initial drag
    map.dragging.disable();
    const container = map.getContainer();
    container.style.cursor = 'grabbing';

    function onMove(ev) {
      const pt = map.mouseEventToContainerPoint(ev);
      const ll = map.containerPointToLatLng(pt);
      wp.lat = ll.lat; wp.lon = ll.lng;
      marker.setLatLng(ll);
    }

    function onUp() {
      container.removeEventListener('mousemove', onMove);
      container.removeEventListener('mouseup',   onUp);
      map.dragging.enable();
      container.style.cursor = '';
      refreshAllIcons();
      renderWaypointList();
      scheduleRoute();
    }

    container.addEventListener('mousemove', onMove);
    container.addEventListener('mouseup',   onUp);
  }

  // ── Elevation profile drag-to-select ─────────────────────────────────────
  let svgDragState = null; // { startX, startDist, isDragging }

  svgEl.addEventListener('mousedown', e => {
    if (!elevData || !elevData._distOf) return;
    e.preventDefault();
    const rect = svgEl.getBoundingClientRect();
    const x    = e.clientX - rect.left;
    const dMin = elevData._distMin ?? 0;
    const dMax = dMin + elevData._totalDist;
    const dist = Math.max(dMin, Math.min(dMax, elevData._distOf(x)));
    svgDragState = { startX: x, startDist: dist, isDragging: false };
    svgEl.classList.add('selecting');
  });

  // Augment existing mousemove: when dragging, draw band + live map overlay
  svgEl.addEventListener('mousemove', e => {
    if (!svgDragState || !elevData) return;
    if (e.buttons !== 1) { svgDragState = null; svgEl.classList.remove('selecting'); return; }
    const rect  = svgEl.getBoundingClientRect();
    const x     = e.clientX - rect.left;
    const dMin  = elevData._distMin ?? 0;
    const dMax  = dMin + elevData._totalDist;
    const dist  = Math.max(dMin, Math.min(dMax, elevData._distOf(x)));

    if (!svgDragState.isDragging && Math.abs(x - svgDragState.startX) > 5) {
      svgDragState.isDragging = true;
      hideElevHover();
      if (hoverMarker) { map.removeLayer(hoverMarker); hoverMarker = null; }
    }
    if (!svgDragState.isDragging) return;

    // Draw shaded selection band over the SVG
    drawSelBand(Math.min(svgDragState.startDist, dist), Math.max(svgDragState.startDist, dist));
    // Live map overlay
    updateSelectionLayer(
      Math.min(svgDragState.startDist, dist),
      Math.max(svgDragState.startDist, dist)
    );
  });

  svgEl.addEventListener('mouseup', e => {
    if (!svgDragState) return;
    const rect  = svgEl.getBoundingClientRect();
    const x     = e.clientX - rect.left;
    const dMin  = elevData?._distMin ?? 0;
    const dMax  = dMin + (elevData?._totalDist ?? 0);
    const dist  = Math.max(dMin, Math.min(dMax, elevData?._distOf ? elevData._distOf(x) : dMin));

    if (svgDragState.isDragging) {
      const d0 = Math.min(svgDragState.startDist, dist);
      const d1 = Math.max(svgDragState.startDist, dist);
      if (d1 - d0 > 200) {
        commitSelection(d0, d1);
      } else {
        // Too small — discard, clear any live overlay
        removeSelectionOverlay();
        renderChart();
      }
    } else {
      // Plain click → clear selection
      clearSelection();
    }
    svgDragState = null;
    svgEl.classList.remove('selecting');
  });

  // Cancel drag if mouse leaves SVG without releasing
  svgEl.addEventListener('mouseleave', () => {
    if (svgDragState?.isDragging) {
      // Keep live overlay but cancel drag state; user may mouseup outside
    }
  });
  document.addEventListener('mouseup', () => {
    if (svgDragState) { svgDragState = null; svgEl.classList.remove('selecting'); }
  });

  /** Draw the semi-transparent selection band in the SVG. */
  function drawSelBand(d0, d1) {
    if (!elevData?._xOf) return;
    let band = document.getElementById('elev-sel-band');
    if (!band) {
      band = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      band.id = 'elev-sel-band';
      band.setAttribute('pointer-events', 'none');
    }
    const x0    = elevData._xOf(d0);
    const x1    = elevData._xOf(d1);
    const H     = elevData._H || svgEl.clientHeight || 130;
    band.setAttribute('x',      Math.min(x0, x1));
    band.setAttribute('y',      PAD_T);
    band.setAttribute('width',  Math.abs(x1 - x0));
    band.setAttribute('height', H - PAD_T - PAD_B);
    band.setAttribute('fill',   'rgba(37,99,235,0.20)');
    band.setAttribute('stroke', 'rgba(37,99,235,0.65)');
    band.setAttribute('stroke-width', '1');
    svgEl.appendChild(band);
  }

  /** Update (or create) the orange selection polyline on the map. */
  /** Remove all selection map layers (overlay + endpoint markers). */
  function removeSelectionOverlay() {
    if (selectionLayer) { map.removeLayer(selectionLayer); selectionLayer = null; }
    if (selStartMarker) { map.removeLayer(selStartMarker); selStartMarker = null; }
    if (selEndMarker)   { map.removeLayer(selEndMarker);   selEndMarker   = null; }
  }

  function updateSelectionLayer(d0, d1) {
    if (!routeGeom) return;

    // Remove existing selection overlay so we always rebuild
