    removeSelectionOverlay();

    // Clip routeGeom points to [d0, d1] but split by surface category using routeSegments
    // Fall back to a single unsplit segment if routeSegments unavailable
    let clipped; // [{latlngs, category}]
    if (routeSegments) {
      clipped = routeSegments
        .filter(s => s.cumDistEnd >= d0 && s.cumDistStart <= d1)
        .map(s => ({
          category: s.category,
          latlngs: routeGeom
            .filter(p => p.cumDist >= Math.max(d0, s.cumDistStart) &&
                         p.cumDist <= Math.min(d1, s.cumDistEnd))
            .map(p => [p.lat, p.lon]),
        }))
        .filter(s => s.latlngs.length >= 2);
    } else {
      clipped = [{
        category: 'paved',
        latlngs: routeGeom.filter(p => p.cumDist >= d0 && p.cumDist <= d1).map(p => [p.lat, p.lon]),
      }];
    }

    if (!clipped.length) return;

    // Cased selection: casings first, then cyan fills (dashed for unpaved)
    const casings = clipped.map(({ latlngs, category }) => L.polyline(latlngs, {
      color: 'rgba(0,0,0,0.55)', weight: category === 'unpaved' ? 7 : 9,
      lineCap: 'round', lineJoin: 'round', interactive: false,
    }));
    const fills = clipped.map(({ latlngs, category }) => L.polyline(latlngs, {
      color:     '#22d3ee',
      weight:    category === 'unpaved' ? 3 : 5,
      opacity:   0.9,
      dashArray: category === 'unpaved' ? '8, 8' : null,
      lineCap:   'butt',
      lineJoin:  'round',
      interactive: false,
    }));
    selectionLayer = L.layerGroup([...casings, ...fills]).addTo(map);

    // Endpoint markers — nearest routeGeom point to d0 and d1
    const selMarkerStyle = { radius: 6, color: 'white', weight: 2, fillColor: '#22d3ee', fillOpacity: 1, interactive: false };
    const ptStart = routeGeom.reduce((best, p) => Math.abs(p.cumDist - d0) < Math.abs(best.cumDist - d0) ? p : best);
    const ptEnd   = routeGeom.reduce((best, p) => Math.abs(p.cumDist - d1) < Math.abs(best.cumDist - d1) ? p : best);
    selStartMarker = L.circleMarker([ptStart.lat, ptStart.lon], selMarkerStyle).addTo(map);
    selEndMarker   = L.circleMarker([ptEnd.lat,   ptEnd.lon],   selMarkerStyle).addTo(map);
  }

  /** Commit the drag selection: zoom chart + map, show stats card. */
  function commitSelection(d0, d1) {
    elevSelection = { distStart: d0, distEnd: d1 };
    updateSelectionLayer(d0, d1);

    // Fit map to selection
    if (routeGeom) {
      const pts = routeGeom
        .filter(p => p.cumDist >= d0 && p.cumDist <= d1)
        .map(p => [p.lat, p.lon]);
      if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [70, 70], animate: true });
    }

    renderChart();
    renderSelStats(d0, d1);
  }

  /** Clear selection: zoom chart + map back to full route. */
  function clearSelection() {
    if (!elevSelection && !selectionLayer) return;
    elevSelection = null;
    removeSelectionOverlay();
    if (routeBounds) map.fitBounds(routeBounds, { padding: [30, 30], animate: true });
    renderChart();
    hideSelStats();
  }

  /** Compute stats for a distance range from elevData. */
  function computeSelStats(d0, d1) {
    const pts = elevData.filter(p => p.cumDist >= d0 && p.cumDist <= d1);
    if (pts.length < 2) return null;
    let gain = 0, loss = 0, maxGrade = -Infinity, minGrade = Infinity;
    for (let i = 1; i < pts.length; i++) {
      const dElev = pts[i].elev - pts[i - 1].elev;
      const dDist = pts[i].cumDist - pts[i - 1].cumDist;
      if (dElev > 0) gain += dElev; else loss += Math.abs(dElev);
      if (dDist > 0) {
        const g = dElev / dDist * 100;
        if (g > maxGrade) maxGrade = g;
        if (g < minGrade) minGrade = g;
      }
    }
    return {
      distM: d1 - d0,
      gain:  Math.round(gain),
      loss:  Math.round(loss),
      maxGrade: isFinite(maxGrade) ? maxGrade : null,
      minGrade: isFinite(minGrade) ? minGrade : null,
    };
  }

  /** Render the selection stats card overlay. */
  function renderSelStats(d0, d1) {
    const card = document.getElementById('sel-stats-card');
    const s    = computeSelStats(d0, d1);
    if (!s) { card.classList.remove('visible'); return; }

    const fmtDist  = s.distM >= 1000 ? (s.distM / 1000).toFixed(2) + ' km' : Math.round(s.distM) + ' m';
    const fmtGrade = g => g != null ? (g > 0 ? '+' : '') + g.toFixed(1) + '%' : '—';

    card.innerHTML = `
      <div class="sel-stat"><span class="sel-stat-val">${fmtDist}</span><span class="sel-stat-lbl">distance</span></div>
      <div class="sel-stat"><span class="sel-stat-val">+${s.gain} m</span><span class="sel-stat-lbl">gain</span></div>
      <div class="sel-stat"><span class="sel-stat-val">−${s.loss} m</span><span class="sel-stat-lbl">loss</span></div>
      <div class="sel-stat"><span class="sel-stat-val">${fmtGrade(s.maxGrade)}</span><span class="sel-stat-lbl">max grade</span></div>
      <div class="sel-stat"><span class="sel-stat-val">${fmtGrade(s.minGrade)}</span><span class="sel-stat-lbl">min grade</span></div>
      <button id="btn-clear-sel" title="Clear selection">✕ Reset</button>`;
    card.classList.add('visible');
    document.getElementById('btn-clear-sel').addEventListener('click', clearSelection);
  }

  function hideSelStats() {
    document.getElementById('sel-stats-card').classList.remove('visible');
  }

  // ── Mode toggle ───────────────────────────────────────────────────────────
  document.getElementById('btn-mode-gradient').addEventListener('click', () => {
    elevMode = 'gradient';
    document.getElementById('btn-mode-gradient').classList.add('active');
    document.getElementById('btn-mode-surface').classList.remove('active');
    renderChart();
  });
  document.getElementById('btn-mode-surface').addEventListener('click', () => {
    elevMode = 'surface';
    document.getElementById('btn-mode-surface').classList.add('active');
    document.getElementById('btn-mode-gradient').classList.remove('active');
    renderChart();
  });

  // ── Collapse / expand panel ───────────────────────────────────────────────
  document.getElementById('btn-toggle-panel').addEventListener('click', () => {
    const panel     = document.getElementById('profile-panel');
    const collapsed = panel.classList.toggle('collapsed');
    document.getElementById('btn-toggle-panel').textContent = collapsed ? '▲ Show' : '▼ Hide';
    setTimeout(() => { map.invalidateSize(); if (!collapsed && elevData) renderChart(); }, 50);
  });

  // ── Collapse / expand sidebar ─────────────────────────────────────────────
  document.getElementById('sidebar-toggle').addEventListener('click', () => {
    const sidebar   = document.getElementById('sidebar');
    const collapsed = sidebar.classList.toggle('collapsed');
    document.getElementById('sidebar-toggle').textContent = collapsed ? '›' : '‹';
    document.getElementById('sidebar-toggle').title = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
    setTimeout(() => { map.invalidateSize(); if (elevData) renderChart(); }, 260); // after transition
  });

  // Re-render chart on window resize
  window.addEventListener('resize', () => { if (elevData) renderChart(); });

  // ── Photon geocoder search ────────────────────────────────────────────────
  (function () {
    const input    = document.getElementById('search-input');
    const dropdown = document.getElementById('search-dropdown');
    const btnSearch = document.getElementById('btn-search');

    let searchTimer  = null;
    let activeIdx    = -1;   // keyboard-highlighted result index
    let lastResults  = [];   // current result set
    let searchMarker = null; // temporary pin shown before "Add as waypoint"

    function openDropdown() { dropdown.classList.add('open'); }
    function closeDropdown() { dropdown.classList.remove('open'); activeIdx = -1; }

    function renderResults(features) {
      lastResults = features;
      activeIdx   = -1;
      dropdown.innerHTML = '';

      if (!features.length) {
        dropdown.innerHTML = '<div class="search-none">No results found.</div>';
        openDropdown();
        return;
      }

      features.forEach((f, i) => {
        const p    = f.properties;
        const name = p.name || p.street || p.city || 'Unknown';
        const parts = [p.city, p.state, p.country].filter(Boolean);
        const sub  = parts.join(', ');

        const item = document.createElement('div');
        item.className = 'search-item';
        item.innerHTML = `<div>${name}</div>${sub ? `<div class="search-item-sub">${sub}</div>` : ''}`;
        item.addEventListener('mousedown', e => {
          e.preventDefault(); // keep input focused
          selectResult(i);
        });
        dropdown.appendChild(item);
      });

      openDropdown();
    }

    function highlightItem(idx) {
      const items = dropdown.querySelectorAll('.search-item');
      items.forEach((el, i) => el.classList.toggle('active', i === idx));
    }

    function selectResult(idx) {
      const f   = lastResults[idx];
      const [lon, lat] = f.geometry.coordinates;
      const p   = f.properties;
      const name = [p.name || p.street, p.city, p.country].filter(Boolean).join(', ');

      input.value = p.name || p.street || p.city || '';
      closeDropdown();

      // Remove any previous search marker
      if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }

      // Fly to result
      map.flyTo([lat, lon], Math.max(map.getZoom(), 14), { duration: 1 });

      // Show popup with "Add as waypoint" button
      searchMarker = L.marker([lat, lon]).addTo(map);
      const popup = L.popup({ closeButton: true, className: 'search-popup' })
        .setContent(() => {
          const div = document.createElement('div');
          div.style.cssText = 'font-size:0.82rem; color:#1e293b; min-width:160px;';
          div.innerHTML = `<strong style="display:block;margin-bottom:6px;">${name}</strong>`;
          const btn = document.createElement('button');
          btn.className  = 'popup-add-btn';
          btn.textContent = '+ Add as waypoint';
          btn.addEventListener('click', () => {
            addWaypoint(lat, lon);
            searchMarker.closePopup();
            map.removeLayer(searchMarker);
            searchMarker = null;
            input.value  = '';
          });
          div.appendChild(btn);
          return div;
        });

      searchMarker.bindPopup(popup).openPopup();
      searchMarker.on('popupclose', () => {
        if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }
      });
    }

    async function doSearch(q) {
      if (q.length < 3) { closeDropdown(); return; }
      try {
        const url  = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6&lang=en`;
        const resp = await fetch(url);
        const data = await resp.json();
        renderResults(data.features || []);
      } catch {
        closeDropdown();
      }
    }

    // Input: debounced search
    input.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const q = input.value.trim();
      if (!q) { closeDropdown(); return; }
      searchTimer = setTimeout(() => doSearch(q), 300);
    });

    // Keyboard navigation
    input.addEventListener('keydown', e => {
      const items = dropdown.querySelectorAll('.search-item');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIdx = Math.min(activeIdx + 1, items.length - 1);
        highlightItem(activeIdx);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIdx = Math.max(activeIdx - 1, 0);
        highlightItem(activeIdx);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (activeIdx >= 0 && activeIdx < lastResults.length) {
          selectResult(activeIdx);
        } else if (lastResults.length > 0) {
          selectResult(0);
        } else {
          doSearch(input.value.trim());
        }
      } else if (e.key === 'Escape') {
        closeDropdown();
      }
    });

    // Search button
    btnSearch.addEventListener('click', () => doSearch(input.value.trim()));

    // Close dropdown when clicking outside
    document.addEventListener('mousedown', e => {
      if (!document.getElementById('search-wrap').contains(e.target)) closeDropdown();
    });
  })();
</script>
</body>
</html>
