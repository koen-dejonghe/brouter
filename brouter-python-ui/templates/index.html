<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRouter UI</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/map-controls.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/elevation.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/search.css') }}" />
</head>
<body>

<aside id="sidebar" aria-label="Route planning controls">
  <button id="sidebar-toggle" type="button" title="Collapse sidebar" aria-controls="sidebar-content" aria-expanded="true" aria-label="Collapse route planning controls">‹</button>
  <div id="sidebar-content">

  <!-- Search -->
  <div id="search-wrap">
    <label class="sr-only" for="search-input">Search for a place or address</label>
    <div id="search-row">
      <input type="search" id="search-input" placeholder="Search place or address…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="search-dropdown" aria-expanded="false" />
      <button id="btn-search" type="button" title="Search" aria-label="Search">⌕</button>
    </div>
    <div id="search-dropdown" role="listbox" aria-label="Search results"></div>
  </div>

  <!-- Waypoint controls -->
  <div id="waypoint-controls">
    <button id="btn-add-waypoint" type="button" aria-pressed="false">+ Add waypoint</button>
    <button id="btn-reverse" type="button" disabled title="Reverse route order">⇅ Reverse</button>
    <button id="btn-close-loop" type="button" disabled title="Append start as endpoint">↺ Loop</button>
    <button id="btn-clear-all" type="button" disabled title="Remove all waypoints">✕ Clear</button>
    <button id="btn-toggle-waypoints" type="button" aria-controls="waypoint-list" aria-expanded="false" title="Show/hide waypoint list">☰ Waypoints</button>
  </div>
  <div id="waypoint-list" role="list" aria-label="Route waypoints"></div>

  <!-- Profile -->
  <div class="field">
    <label for="profile">Profile</label>
    <select id="profile">
      {% for p in profiles %}
      <option value="{{ p }}" {% if p == 'trekking' %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </div>

  <!-- Profile settings (collapsible, dynamic) -->
  <details id="profile-settings">
    <summary>
      Profile settings
      <span id="changed-badge" style="display:none; font-size:0.7rem; background:#2563eb; color:white; border-radius:10px; padding:1px 7px;">changed</span>
    </summary>
    <div id="profile-settings-body">
      <div id="params-loading">Loading…</div>
    </div>
    <div style="padding: 4px 10px 10px;">
       <button id="btn-reset-params" type="button">Reset to defaults</button>
    </div>
  </details>

  <!-- Alternative -->
  <div class="field">
    <label for="alternativeidx">Alternative route</label>
    <select id="alternativeidx">
      <option value="0">0 — primary</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
    </select>
  </div>

  <!-- Output format -->
  <div class="field">
    <label for="format">Download format</label>
    <select id="format">
      <option value="gpx">GPX</option>
      <option value="geojson">GeoJSON</option>
      <option value="kml">KML</option>
      <option value="csv">CSV</option>
    </select>
  </div>

  <!-- Track name -->
  <div class="field">
    <label for="trackname">Track name</label>
    <input type="text" id="trackname" />
  </div>

  <details id="poi-panel" class="field">
    <summary>POIs</summary>
    <div id="poi-controls">
      <label class="poi-inline"><input type="checkbox" id="poi-enabled" /> Show POIs</label>
      <label class="poi-inline"><input type="checkbox" id="poi-water" checked /> Water</label>
      <label class="poi-inline"><input type="checkbox" id="poi-food" checked /> Food</label>
      <label class="poi-inline"><input type="checkbox" id="poi-shelter" checked /> Shelter</label>
      <div id="poi-status" class="hint">POIs are loaded from OpenStreetMap.</div>
      <div id="poi-marked" class="hint">Marked POIs: 0</div>
    </div>
  </details>

  <!-- Actions -->
  <div id="route-actions">
    <button id="btn-import-gpx" type="button">Upload Route</button>
    <button id="btn-download" type="button" disabled>Download Route</button>
    <input type="file" id="gpx-file-input" accept=".gpx,application/gpx+xml" hidden />
  </div>
  <div id="surface-enrich-progress" class="import-progress" role="status" aria-live="polite" style="display:none;">
    <span class="spinner" aria-hidden="true"></span>
    <span>Fetching surface details via BRouter...</span>
  </div>

  <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Stats -->
  <div id="stats" style="display:none;">
    <strong>Route info</strong>
    <div id="stats-body"></div>
  </div>

  </div><!-- /#sidebar-content -->
</aside>

<!-- Map column: map + elevation panel -->
<main id="map-column">
  <div id="map" role="region" aria-label="Interactive route map"></div>

  <div id="profile-panel" class="collapsed">
    <!-- Header -->
    <div id="profile-panel-header">
      <span id="profile-panel-title">Elevation profile</span>
      <button class="mode-btn active" type="button" id="btn-mode-gradient" aria-pressed="true">Gradient</button>
      <button class="mode-btn" type="button" id="btn-mode-surface" aria-pressed="false">Surface</button>
      <button id="btn-toggle-panel" type="button" aria-controls="profile-panel-body" aria-expanded="false">▲ Show</button>
    </div>
    <!-- Chart -->
    <div id="profile-panel-body">
       <svg id="elev-svg" role="img" aria-labelledby="profile-panel-title" tabindex="0"></svg>
      <div id="elev-hairline"></div>
      <div id="elev-tooltip"></div>
      <div id="sel-stats-card"></div>
    </div>
    <!-- Surface legend -->
    <div id="surface-legend"></div>
  </div>
</main>

<div id="context-menu" role="menu" aria-label="Map actions" style="display:none"></div>

<!-- Jinja2 data bridge: pass server-side data to ES modules -->
<script>
  window.PROFILES = {{ profiles | tojson }};
  window.APP_CONFIG = {{ {"maxGpxFileSize": max_gpx_file_size} | tojson }};
</script>

<!-- App entry point -->
<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
